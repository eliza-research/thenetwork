# ntwrk.love public site: what The Network is, the SMS/iMessage program, privacy policy and terms.
# Required for A2P 10DLC registration (carriers review the opt-in description, privacy policy and SMS terms).
# Deploy only with founder approval:  NTWRK_ALLOW_DEPLOY=1 ../../scripts/wrangler.sh deploy
# Pages are built from ./public into ./dist by Bun's HTML bundler ([build] below runs it before deploy).
# Route note: /api/* is NOT served by this Worker. It belongs to the shared platform API, on the same
# origin. Before /join and /settings can work in production, send "ntwrk.love/api/*" to that API:
# either a zone route on the API Worker, or a service binding plus run_worker_first = ["/api/*"] here.
# Check which one Cloudflare applies first with a custom domain before choosing. Not set up yet.
name = "ntwrk-love-site"
compatibility_date = "2026-10-01"
account_id = "50ad2052bbc6ca528d6993a689b419a4"
routes = [
  { pattern = "ntwrk.love", custom_domain = true },
  { pattern = "www.ntwrk.love", custom_domain = true },
]

[build]
command = "bun run ../sites.ts ntwrk"

[assets]
directory = "./dist"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
