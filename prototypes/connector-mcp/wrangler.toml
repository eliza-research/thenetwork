# Cloudflare Worker for The Network's MCP origin, https://mcp.ntwrk.party/mcp (design §2.5, §12).
# Prototype config only. DO NOT DEPLOY from here: the authorization server is a stub and the
# production plan is a host-classified shard inside the eliza-cloud-api Worker (design D1, §13.3).
# Validate without deploying (repo root). Always name the environment: the top level is production
# (--env="") and [env.staging] is staging; omitting --env makes wrangler warn and guess.
#   ./scripts/wrangler.sh deploy --dry-run --env="" -c prototypes/connector-mcp/wrangler.toml
#   ./scripts/wrangler.sh deploy --dry-run --env staging -c prototypes/connector-mcp/wrangler.toml
# No secrets live here: the prototype needs none, and production secrets go in `wrangler secret put` (design §12.2).
name = "network-mcp"
# Cloudflare account that owns the ntwrk.party zone.
account_id = "50ad2052bbc6ca528d6993a689b419a4"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
# node:crypto (HMAC item handles, idempotency hashes) needs nodejs_compat.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Route on the ntwrk.party zone. The MCP host serves root paths (/.well-known/*, /oauth/*, /mcp);
# the Worker returns 404 for any other host (enforceHost).
routes = [
  { pattern = "mcp.ntwrk.party/*", zone_name = "ntwrk.party" },
]

[vars]
NETWORK_DOMAIN = "ntwrk.party"
MCP_ORIGIN = "https://mcp.ntwrk.party"
# Off by default (design §12.1): every path returns 404 until this is "true".
NETWORK_MCP_ENABLED = "false"
ALLOWED_BROWSER_ORIGINS = "https://claude.ai,https://chatgpt.com"

[observability]
enabled = true
head_sampling_rate = 1

[env.staging]
name = "network-mcp-staging"
routes = [
  { pattern = "mcp-staging.ntwrk.party/*", zone_name = "ntwrk.party" },
]

[env.staging.vars]
NETWORK_DOMAIN = "ntwrk.party"
MCP_ORIGIN = "https://mcp-staging.ntwrk.party"
NETWORK_MCP_ENABLED = "false"
ALLOWED_BROWSER_ORIGINS = "https://claude.ai,https://chatgpt.com"
