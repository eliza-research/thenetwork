# Candidate artifact only. Import, qualification and receiver activation keep their own gates.
name: backend candidate artifact

on:
  pull_request:
    paths: [.github/workflows/backend-candidate-artifact.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-candidate-3d7a2f7-artifact
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SOURCE: 3d7a2f7c32a063b86e825670b9cdb2c07e93a4c7
      CANDIDATE_TREE: 4a27be0d43310711d362cc8cd51d762deaee8320
      # No ref input, repository secret, environment, registry login or runtime access.
      BUILDKIT_IMAGE: moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NubsCarson/thenetwork
          ref: 3d7a2f7c32a063b86e825670b9cdb2c07e93a4c7
          persist-credentials: false

      - name: Collect the exact reviewed backend inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          source, tree = os.environ['CANDIDATE_SOURCE'], os.environ['CANDIDATE_TREE']
          git = lambda *args: subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == source
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == tree
          assert not git('status', '--porcelain').strip()
          paths = git('ls-tree', '-r', '--name-only', source).decode().splitlines()
          paths = [p for p in paths if p in ('package.json', 'bun.lock', 'tsconfig.json', 'evals/relay/clef-relay-weights.json') or p.startswith(('packages/', 'deploy/'))]
          assert len(paths) == 435
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backend-candidate'
          context = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backend-context'
          output.mkdir(); context.mkdir()
          rows = []
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backend-source.tar'
          with tarfile.open(archive, 'w') as tar:
              for name in paths:
                  data = git('show', source + ':' + name)
                  rows.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                  info = tarfile.TarInfo(name); info.mode = 0o644; info.size = len(data)
                  tar.addfile(info, io.BytesIO(data))
                  target = context / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data); target.chmod(0o644)
          archive_hash = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive_hash == 'bad46f0841cb8f334819a06bb836b932c60c369ab495867a0411e501835dbc19'
          manifest = {'source': source, 'sourceTree': tree, 'archiveSource': source,
              'canonicalDockerfile': 'deploy/backend/Dockerfile', 'files': rows,
              'sourceFileCount': len(rows), 'archiveSHA256': archive_hash,
              'archiveBytes': archive.stat().st_size, 'noSecretsNoDependencies': True}
          (output / 'CANONICAL-BACKEND-INPUTS.json').write_text(json.dumps(manifest, indent=2) + '\n')
          assert 'oven/bun:1.4.2-slim@sha256:cb3bbbb08e13a4a2ff400f24c7a2a1d5efa83f6ef8544d52d95a519631e2fc61' in (context / 'deploy/backend/Dockerfile').read_text()
          PY

      - name: Export the normal Dockerfile as a linux amd64 OCI archive
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker version > "$RUNNER_TEMP/backend-candidate/docker-version.txt"
          docker buildx version > "$RUNNER_TEMP/backend-candidate/buildx-version.txt"
          docker buildx create --name network-candidate --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap > "$RUNNER_TEMP/backend-candidate/builder.txt"
          docker buildx build --builder network-candidate --platform linux/amd64 \
            --file "$RUNNER_TEMP/backend-context/deploy/backend/Dockerfile" \
            --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/backend-candidate/build-metadata.json" \
            --output "type=oci,dest=$RUNNER_TEMP/backend-candidate/backend.oci.tar" \
            "$RUNNER_TEMP/backend-context"

      - name: Verify the archive and record candidate provenance
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'backend-candidate'
          archive = output / 'backend.oci.tar'
          with tarfile.open(archive) as tar:
              def blob(descriptor):
                  algorithm, digest = descriptor['digest'].split(':')
                  assert algorithm == 'sha256'
                  data = tar.extractfile('blobs/sha256/' + digest).read()
                  assert len(data) == descriptor['size']
                  assert hashlib.sha256(data).hexdigest() == digest
                  return data
              index = json.load(tar.extractfile('index.json'))
              assert len(index['manifests']) == 1
              descriptor = index['manifests'][0]
              manifest = json.loads(blob(descriptor))
              config = json.loads(blob(manifest['config']))
              assert (config['os'], config['architecture']) == ('linux', 'amd64')
              assert config['config']['User'] == 'bun'
              assert config['config']['Cmd'] == ['bun', 'run', 'deploy/backend/server.ts']
              for layer in manifest['layers']:
                  blob(layer)
          receipt = {'state': 'CANDIDATE_ARTIFACT_ONLY',
              'source': os.environ['CANDIDATE_SOURCE'], 'sourceTree': os.environ['CANDIDATE_TREE'],
              'workflowSha': os.environ['WORKFLOW_SHA'], 'runId': os.environ['RUN_ID'],
              'runAttempt': os.environ['RUN_ATTEMPT'], 'platform': 'linux/amd64',
              'buildkitImage': os.environ['BUILDKIT_IMAGE'], 'manifestDigest': descriptor['digest'],
              'imageConfigDigest': manifest['config']['digest'], 'archiveBytes': archive.stat().st_size,
              'archiveSHA256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest(),
              'inputsManifestSHA256': hashlib.sha256((output / 'CANONICAL-BACKEND-INPUTS.json').read_bytes()).hexdigest(),
              'pushed': False, 'loaded': False, 'deployed': False, 'runtimeQualified': False,
              'receiverActivationApproved': False}
          (output / 'BUILD-RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with (output / 'SHA256SUMS').open('w') as sums:
              for path in sorted(output.iterdir()):
                  if path.name != 'SHA256SUMS':
                      sums.write(hashlib.file_digest(path.open('rb'), 'sha256').hexdigest() + '  ' + path.name + '\n')
          PY

      - name: Retain the candidate and its receipts for seven days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-candidate-3d7a2f7-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
