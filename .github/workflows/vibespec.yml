name: Vibespec

on:
  push:
    branches: [main]
    paths:
      - 'spec/*.md'
      - 'packages/core/src/generated/**'
      - 'scripts/spec-snapshots.ts'
      - 'tools/vibespec/**'
      - '.github/workflows/vibespec.yml'
  pull_request:
    paths:
      - 'spec/*.md'
      - 'packages/core/src/generated/**'
      - 'scripts/spec-snapshots.ts'
      - 'tools/vibespec/**'
      - '.github/workflows/vibespec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/vibespec/package-lock.json
      - run: npm run spec:setup
      - if: hashFiles('spec/*.md', 'packages/core/src/generated/*.ts') != ''
        run: npm run spec:check-generated

  full-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/vibespec/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: npm run spec:setup
      - run: npm run check
