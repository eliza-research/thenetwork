name: Vibestack

on:
  push:
    branches: [main, vibestack]
    paths:
      - 'spec/**'
      - 'packages/core/src/generated/**'
      - 'packages/core/src/vibe/**'
      - 'scripts/spec-snapshots.ts'
      - 'tools/vibestack/**'
      - 'scripts/vibestack.ts'
      - 'apps/site/**'
      - 'sites/**'
      - 'packages/design-system/**'
      - 'packages/ui/**'
      - 'deploy/router.ts'
      - 'packages/platform/src/**'
      - 'scripts/sites-dev.ts'
      - 'test/bombadil.ts'
      - 'test/fixtures/browserSignup.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/vibespec.yml'
  pull_request:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: corepack pnpm@10.24.0 --filter vibestack install --frozen-lockfile --ignore-scripts
        working-directory: tools/vibestack
      - if: hashFiles('spec/**/*.md', 'packages/core/src/generated/*.ts') != ''
        run: pnpm run spec:check-generated

  browser:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - run: pnpm --dir tools/vibestack exec playwright install --with-deps chromium
      - run: pnpm run spec:explore

  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Put the Postgres client tools on PATH
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Initialize conformance Postgres
        run: |
          pg_isready -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
          node --import tsx packages/observatory/db/dev-pg.ts up
      - run: pnpm run connector:css
      - name: Full check (the nightly profile on the schedule)
        env:
          PROFILE: ${{ github.event_name == 'schedule' && '--nightly' || '' }}
        run: pnpm run check $PROFILE
