# Build, verify in offline workerd, and deploy the four sites as Cloudflare Pages projects via Alchemy v2
# (deploy/sites.alchemy.ts): ntwrk-party, slop-date, peon-biz and friends-help, production branch main.
# Each build writes sites/<domain>/dist with the static pages, _headers, the skill files, and an
# advanced-mode _worker.js (deploy/router.ts) with _routes.json.
#
#   push to main -> typecheck, build, offline workerd verification, then behind the "production"
#                   GitHub environment (required reviewers set by founder): inspect live production
#                   bindings and Turnstile hostname coverage, build, pre-warm Wrangler, and run a
#                   single-pass Alchemy v2 deploy with post-deploy deploy/smoke.ts verification.
#   pull request -> typecheck, production build, and offline workerd verification only. No PR previews:
#                   PR code never runs next to deploy tokens or production proxy secrets.
#
# Secrets (environment "production"): CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).
# Manual repair-proxy-and-deploy additionally uses the production environment PLATFORM_PROXY_SECRET,
# supplied by the owner, only to rotate this exact Pages binding.
# Variables: CLOUDFLARE_ACCOUNT_ID, BACKEND_ORIGIN (default https://api.ntwrk.party),
# TURNSTILE_SITE_KEY, BACKEND_LIVE ("true" adds /api/app to the smoke check).
name: deploy-sites

on:
  push:
    branches: [main]
    paths: &site-paths
      - 'alchemy.run.ts'
      - 'apps/site/**'
      - 'sites/**'
      - 'packages/design-system/**'
      - 'packages/ui/**'
      - 'packages/core/src/generated/**'
      - 'packages/core/src/types.ts'
      - 'packages/notify/src/reference.ts'
      - 'packages/platform/src/proxy.ts'
      - 'packages/platform/src/apps.ts'
      - 'packages/platform/src/body.ts'
      - 'deploy/alchemy-sites.ts'
      - 'deploy/sites.alchemy.ts'
      - 'deploy/tsconfig.alchemy.json'
      - 'deploy/pages-worker.ts'
      - 'deploy/router.ts'
      - 'deploy/smoke.ts'
      - 'deploy/vitest.config.ts'
      - 'deploy/worker.test.ts'
      - 'scripts/alchemy.sh'
      - 'scripts/sites-dev.ts'
      - 'tools/vibestack/tsconfig.base.json'
      - 'tools/vibestack/vibestack/alchemy.ts'
      - 'tools/vibestack/vibestack/design/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/actions/setup-pnpm-cache/**'
      - '.github/workflows/deploy-sites.yml'
  pull_request:
    paths: *site-paths
  workflow_dispatch:
    inputs:
      pages_operation:
        description: Inspect (read-only), deploy, repair backend origin, or explicitly rotate the proxy secret and deploy
        type: choice
        options: [inspect, deploy, repair-and-deploy, repair-proxy-and-deploy]
        default: inspect

permissions:
  contents: read

concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with WRANGLER_VERSION in scripts/wrangler.sh and deploy/alchemy-sites.ts.
  WRANGLER_VERSION: "4.136.3"
  ALCHEMY_FAST_DISTILLED: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - name: Typecheck sites, router, scripts, and Alchemy stack
        run: |
          pnpm exec tsc --noEmit -p sites/tsconfig.json
          pnpm --filter @thenetwork/site run typecheck
          pnpm exec tsc --noEmit -p deploy/tsconfig.alchemy.json
      - name: Production build (refuses draft legal text and unfilled placeholders)
        run: pnpm run sites:build
        env:
          DEPLOY_TARGET: production
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          MCP_URL: "https://{domain}/mcp"
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Offline edge router verification in workerd (test:deploy)
        run: pnpm exec vitest run --config deploy/vitest.config.ts
        timeout-minutes: 5

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The founder sets required reviewers on this environment (Settings > Environments > production).
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm-cache
        with:
          scope: production
      - run: pnpm install --frozen-lockfile
      # Inspect canonical projects only. Only main receives the existing production credential.
      # PATCH merges only selected env keys. Existing secret values are never read or resubmitted.
      # https://developers.cloudflare.com/api/resources/pages/subresources/projects/methods/edit/
      - name: Inspect production bindings and optionally repair backend routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          CUTOVER_PROXY_SECRET: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_operation == 'repair-proxy-and-deploy' && secrets.PLATFORM_PROXY_SECRET || '' }}
          CUTOVER_BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          PAGES_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_operation || 'deploy' }}
        run: |
          node --import tsx --input-type=module - <<'JS'
          import { createHash } from "node:crypto";
          import { SITES } from "./sites/sites.ts";
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account, TURNSTILE_SITE_KEY: sitekey, PAGES_OPERATION: operation } = process.env;
          const inspectOnly = operation === "inspect";
          if (!token || !account) throw new Error("Missing production Pages authority");
          if (!inspectOnly && !sitekey?.startsWith("0x")) throw new Error("Missing real public Turnstile key");
          if (inspectOnly && sitekey && !sitekey.startsWith("0x")) throw new Error("Invalid public Turnstile key");
          const rotateProxy = operation === "repair-proxy-and-deploy";
          const repair = operation === "repair-and-deploy" || rotateProxy;
          const secret = process.env.CUTOVER_PROXY_SECRET;
          const url = new URL(process.env.CUTOVER_BACKEND_ORIGIN || "https://api.ntwrk.party");
          if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/") throw new Error("Invalid declared HTTPS backend origin; no changes made");
          const backend = url.origin;
          if (rotateProxy && (!process.env.CUTOVER_BACKEND_ORIGIN || !secret || secret.length < 32 || /[\r\n]/.test(secret))) throw new Error("Missing or invalid explicit cutover origin or production proxy secret; no changes made");
          const api = async (path, label, init = {}) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/${path}`, {
              ...init, headers: { authorization: `Bearer ${token}`, "content-type": "application/json" }, redirect: "error", signal: AbortSignal.timeout(15000),
            });
            const body = await response.json();
            if (!response.ok || !body.success || !body.result) throw new Error(`${label}: Cloudflare metadata request failed (${response.status})`);
            return body.result;
          };
          let widget;
          if (sitekey) {
            try { widget = await api(`challenges/widgets/${sitekey}`, "Turnstile hostname coverage"); } catch {}
          }
          const inspected = [];
          for (const site of SITES) {
            const project = site.project;
            const current = await api(`pages/projects/${project}`, project);
            const vars = current.deployment_configs?.production?.env_vars ?? {};
            const value = name => vars[name]?.type === "plain_text" ? vars[name].value : undefined;
            let origin;
            try { const u = new URL(value("BACKEND_ORIGIN")); if (u.protocol === "https:" && !u.username && !u.password && !u.search && !u.hash && u.pathname === "/") origin = u.origin; } catch {}
            console.log(JSON.stringify({project,branch:current.production_branch,backend:origin ?? (vars.BACKEND_ORIGIN ? "invalid binding" : "built fallback"),app:value("APP_ID") === site.app ? site.app : "missing or unexpected",host:value("SITE_HOST") === site.domain ? site.domain : "missing or unexpected",proxySecretPresent:vars.PLATFORM_PROXY_SECRET?.type === "secret_text"}));
            if (current.production_branch !== "main" || !current.domains?.includes(site.domain)
              || (!rotateProxy && vars.PLATFORM_PROXY_SECRET?.type !== "secret_text")
              || (vars.APP_ID && value("APP_ID") !== site.app) || (vars.SITE_HOST && value("SITE_HOST") !== site.domain)
              || (vars.BACKEND_ORIGIN && !origin)) throw new Error(`${project}: production identity or bindings require owner review`);
            let hostQualification = "UNQUALIFIED";
            if (sitekey && widget && Array.isArray(widget.domains) && widget.domains.every(domain=>typeof domain === "string")) {
              const covered = widget.domains.some(domain=>site.domain === domain || site.domain.endsWith(`.${domain}`));
              hostQualification = covered ? "QUALIFIED" : "FAILED";
            }
            if (sitekey) {
              console.log(JSON.stringify({project,turnstileKeySha256:createHash("sha256").update(sitekey).digest("hex"),hostQualification,publicOtpReadiness:"UNQUALIFIED"}));
            } else {
              console.log(JSON.stringify({project,turnstileKeyPresent:false,hostQualification,publicOtpReadiness:"UNQUALIFIED"}));
            }
            if (hostQualification === "FAILED") throw new Error(`${project}: existing Turnstile widget does not cover the canonical hostname`);
            const old = vars.BACKEND_ORIGIN?.value;
            if (!repair && !inspectOnly && old && old !== backend) {
              throw new Error(`${project}: explicit manual repair approval is required`);
            }
            inspected.push({site,project,current,vars,old});
          }
          for (const selected of inspected) {
            const { project, old } = selected;
            if (repair && (old !== backend || rotateProxy)) {
              const config = selected.current.deployment_configs.production;
              const changes = { BACKEND_ORIGIN: {type:"plain_text",value:backend} };
              if (rotateProxy) changes.PLATFORM_PROXY_SECRET = {type:"secret_text",value:secret};
              await api(`pages/projects/${project}`, project, {method:"PATCH",body:JSON.stringify({deployment_configs:{production:{env_vars:changes,wrangler_config_hash:config.wrangler_config_hash}}})});
              const after = (await api(`pages/projects/${project}`, `${project} readback`)).deployment_configs.production.env_vars;
              const remaining = vars => JSON.stringify(Object.entries(vars).filter(([name])=>name!=="BACKEND_ORIGIN" && !(rotateProxy && name==="PLATFORM_PROXY_SECRET")).sort(([a],[b])=>a.localeCompare(b)));
              if (after.BACKEND_ORIGIN?.type !== "plain_text" || after.BACKEND_ORIGIN.value !== backend || (rotateProxy && after.PLATFORM_PROXY_SECRET?.type !== "secret_text") || remaining(after) !== remaining(selected.vars)) throw new Error(`${project}: runtime readback did not preserve other bindings`);
            }
            console.log(JSON.stringify({project,operation,repairRequired:old!==backend}));
          }
          JS
      # The build has no Cloudflare token in its environment.
      - name: Production build of all four sites (single pass)
        if: github.event_name != 'workflow_dispatch' || inputs.pages_operation != 'inspect'
        run: |
          test -n "$TURNSTILE_SITE_KEY" || { echo "Missing real public Turnstile key"; exit 1; }
          pnpm run sites:build
        env:
          DEPLOY_TARGET: production
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          MCP_URL: "https://{domain}/mcp"
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Pre-warm pinned Wrangler CLI
        if: github.event_name != 'workflow_dispatch' || inputs.pages_operation != 'inspect'
        run: pnpm dlx "wrangler@${WRANGLER_VERSION}" --version
      - name: Restore Alchemy sites state
        id: alchemy-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .alchemy/state
          key: alchemy-sites-state-v1-production-${{ github.sha }}-${{ github.run_id }}
          restore-keys: alchemy-sites-state-v1-production-
      - name: Preflight Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .alchemy/state
          bash scripts/alchemy.sh provider check-env
      - name: Plan Pages deployment (read-only inspect)
        if: github.event_name == 'workflow_dispatch' && inputs.pages_operation == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          BACKEND_LIVE: ${{ vars.BACKEND_LIVE }}
        run: bash scripts/alchemy.sh plan --config deploy/sites.alchemy.ts --stage production --no-input
      - name: Deploy and smoke-verify all four Pages sites via Alchemy v2
        id: deploy
        if: github.event_name == 'push' || inputs.pages_operation != 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          BACKEND_LIVE: ${{ (vars.BACKEND_LIVE == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.pages_operation == 'repair-and-deploy' || inputs.pages_operation == 'repair-proxy-and-deploy'))) && 'true' || 'false' }}
          NTWRK_ALLOW_DEPLOY: "1"
        run: bash scripts/alchemy.sh deploy --config deploy/sites.alchemy.ts --stage production --adopt --yes --no-input
      - name: Save Alchemy sites state
        if: (github.event_name == 'push' || inputs.pages_operation != 'inspect') && !cancelled() && steps.deploy.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .alchemy/state
          key: alchemy-sites-state-v1-production-${{ github.sha }}-${{ github.run_id }}
