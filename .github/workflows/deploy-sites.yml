# Build, verify in offline workerd, and deploy the four sites as Cloudflare Pages projects via Alchemy v2
# (deploy/sites.alchemy.ts): ntwrk-party, slop-date, peon-biz and friends-help, production branch main.
# Each build writes sites/<domain>/dist with the static pages, _headers, the skill files, and an
# advanced-mode _worker.js (deploy/router.ts) with _routes.json.
#
#   push to main -> typecheck, build, offline workerd verification, then single-pass Alchemy v2 deploy
#                   behind the "production" GitHub environment (required reviewers set by founder) with
#                   memoized Wrangler Pages upload (preserving unmanaged PLATFORM_PROXY_SECRET) and
#                   post-deploy deploy/smoke.ts verification.
#   pull request -> typecheck, production build, and offline workerd verification only. No PR previews:
#                   PR code never runs next to deploy tokens or production proxy secrets.
#
# Secrets (environment "production"): CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit).
# Variables: CLOUDFLARE_ACCOUNT_ID, BACKEND_ORIGIN (default https://api.ntwrk.party),
# TURNSTILE_SITE_KEY, BACKEND_LIVE ("true" adds /api/app to the smoke check).
name: deploy-sites

on:
  push:
    branches: [main]
    paths: &site-paths
      - 'alchemy.run.ts'
      - 'apps/site/**'
      - 'sites/**'
      - 'packages/design-system/**'
      - 'packages/ui/**'
      - 'packages/core/src/generated/**'
      - 'packages/core/src/types.ts'
      - 'packages/notify/src/reference.ts'
      - 'packages/platform/src/proxy.ts'
      - 'packages/platform/src/apps.ts'
      - 'packages/platform/src/body.ts'
      - 'deploy/alchemy-sites.ts'
      - 'deploy/sites.alchemy.ts'
      - 'deploy/tsconfig.alchemy.json'
      - 'deploy/pages-worker.ts'
      - 'deploy/router.ts'
      - 'deploy/smoke.ts'
      - 'deploy/vitest.config.ts'
      - 'deploy/worker.test.ts'
      - 'scripts/sites-dev.ts'
      - 'tools/vibestack/tsconfig.base.json'
      - 'tools/vibestack/vibestack/alchemy.ts'
      - 'tools/vibestack/vibestack/design/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/actions/setup-pnpm-cache/**'
      - '.github/workflows/deploy-sites.yml'
  pull_request:
    paths: *site-paths
  workflow_dispatch:
    inputs:
      pages_operation:
        description: Plan (read-only) or deploy all four Pages sites via Alchemy v2
        type: choice
        options: [inspect, deploy]
        default: inspect

permissions:
  contents: read

concurrency:
  group: deploy-sites-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with WRANGLER_VERSION in scripts/wrangler.sh and deploy/alchemy-sites.ts.
  WRANGLER_VERSION: "4.136.3"
  ALCHEMY_FAST_DISTILLED: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm-cache
      - run: pnpm install --frozen-lockfile
      - name: Typecheck sites, router, scripts, and Alchemy stack
        run: |
          pnpm exec tsc --noEmit -p sites/tsconfig.json
          pnpm --filter @thenetwork/site run typecheck
          pnpm exec tsc --noEmit -p deploy/tsconfig.alchemy.json
      - name: Production build (refuses draft legal text and unfilled placeholders)
        run: pnpm run sites:build
        env:
          DEPLOY_TARGET: production
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          MCP_URL: "https://{domain}/mcp"
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Offline edge router verification in workerd (test:deploy)
        run: pnpm exec vitest run --config deploy/vitest.config.ts
        timeout-minutes: 5

  production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The founder sets required reviewers on this environment (Settings > Environments > production).
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup-pnpm-cache
        with:
          scope: production
      - run: pnpm install --frozen-lockfile
      # The build has no Cloudflare token in its environment.
      - name: Production build of all four sites (single pass)
        run: |
          test -n "$TURNSTILE_SITE_KEY" || { echo "Missing real public Turnstile key"; exit 1; }
          pnpm run sites:build
        env:
          DEPLOY_TARGET: production
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          MCP_URL: "https://{domain}/mcp"
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Restore Alchemy sites state
        id: alchemy-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .alchemy/state
          key: alchemy-sites-state-v1-production-${{ github.sha }}-${{ github.run_id }}
          restore-keys: alchemy-sites-state-v1-production-
      - name: Preflight Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p .alchemy/state
          pnpm exec alchemy --fast-distilled provider check-env
      - name: Plan Pages deployment (read-only inspect)
        if: github.event_name == 'workflow_dispatch' && inputs.pages_operation == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          BACKEND_LIVE: ${{ vars.BACKEND_LIVE }}
        run: pnpm exec alchemy --fast-distilled plan --config deploy/sites.alchemy.ts --stage production --no-input
      - name: Deploy and smoke-verify all four Pages sites via Alchemy v2
        id: deploy
        if: github.event_name == 'push' || inputs.pages_operation == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          BACKEND_LIVE: ${{ vars.BACKEND_LIVE }}
          NTWRK_ALLOW_DEPLOY: "1"
        run: pnpm exec alchemy --fast-distilled deploy --config deploy/sites.alchemy.ts --stage production --adopt --yes --no-input
      - name: Save Alchemy sites state
        if: (github.event_name == 'push' || inputs.pages_operation == 'deploy') && !cancelled() && steps.deploy.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .alchemy/state
          key: alchemy-sites-state-v1-production-${{ github.sha }}-${{ github.run_id }}
