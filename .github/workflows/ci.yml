# CI: install, typecheck, `bun run sim` (the simulations and their gates), the plugin build check and
# the sites production build; plus the integration and e2e suites (security suite included) with a
# real Postgres. Validation policy: simulations + integration + e2e, no unit or smoke tests
# (docs/tests-policy.md). No
# secrets are given to CI, and LIVE_TESTS is never set, so no paid LLM call, Blooio or Twilio call,
# or Cloudflare deploy can happen here. Deploys live in deploy-sites.yml. Actions and the Postgres image are pinned by digest.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Blank every provider key and leave LIVE_TESTS unset: live tests skip themselves.
  SURPLUS_API_KEY: ""
  OPENAI_API_KEY: ""
  BLOOIO_API_KEY: ""
  BLOOIO_LIVE_TEST: ""
  TWILIO_AUTH_TOKEN: ""
  TURNSTILE_SECRET_KEY: ""
  CLOUDFLARE_API_TOKEN: ""
  NTWRK_ALLOW_DEPLOY: ""
  LLM_ALLOW_OPENAI_FALLBACK: ""
  # Any accidental LLM call fails fast instead of hanging.
  LLM_TIMEOUT_MS: "10000"
  LLM_MAX_RETRIES: "0"

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Typecheck (packages, deploy, tests, scripts/sim)
        run: bunx tsc --noEmit -p .
        timeout-minutes: 5
      - name: Typecheck (sites, scripts)
        run: bunx tsc --noEmit -p sites/tsconfig.json
        timeout-minutes: 5
      - name: Simulations (bun run sim)
        # The simulations: evals corpora, the Network in the NYC world, slop, peon and friends, each
        # with its gates on pinned seeds. No LLM, no Postgres. Exits 1 on any blocking gate failure.
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          bun run sim
        timeout-minutes: 30
      - name: Plugin packages match their sources (OpenAI and Claude manifests, SKILL.md snapshots)
        run: bun run plugins/build.ts --check
      - name: The retired domain is gone (the hub is ntwrk.party; the old domain only redirects)
        run: |
          if git grep -n -I -E 'ntwrk[.]love' -- .; then echo "use ntwrk.party / api.ntwrk.party instead"; exit 1; fi
      - name: Production build of the four sites (refuses draft legal text and unfilled placeholders)
        run: bun run sites/sites.ts
        env:
          DEPLOY_TARGET: production

  integration:
    # The integration suite (real Postgres, real HTTP servers, several packages together, the full
    # service; the security files are part of it: platform row-level security and composite keys, CSRF
    # and enumeration limits, MCP OAuth PKCE, the backend's "two logins" RLS check) and the e2e suite
    # (tests/e2e). Sends are dry-run and OTP providers are fakes: nothing leaves the runner.
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # The dev Postgres port (54339). The test helpers create one database per test process.
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres suites must run, not skip: the check step below fails the job without Postgres.
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Put the Postgres client tools on PATH
        # The test helpers call initdb, pg_isready and pg_ctl (packages/observatory/db/dev-pg.ts).
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install
        run: bun install --frozen-lockfile
        timeout-minutes: 5
      - name: Require Postgres
        # REQUIRE_PG=1: a missing Postgres fails here, so no Postgres suite can skip silently.
        run: |
          pg_isready -h localhost -p 54339
          bun run scripts/require-pg.ts
      - name: Integration suite (includes the security suite)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          bun run test:integration
        timeout-minutes: 30
      - name: E2E suite (tests/e2e)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          bun run test:e2e
        timeout-minutes: 10

