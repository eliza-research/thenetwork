# Railway config as code for the shared backend service (docs/deploy.md, section 2).
# In the service settings, set "Config-as-code path" to /deploy/backend/railway.toml.
# Environment variables are not set here: they live in the Railway service (docs/deploy.md, section 2.3).

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/backend/Dockerfile"
# Redeploy only when something the image contains changes.
watchPatterns = ["packages/**", "deploy/backend/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.json"]

[deploy]
startCommand = "node --import tsx deploy/backend/server.ts"
# startCommand is the Dockerfile CMD and has no --dry-run: with NETWORK_CHANNEL and its credentials, sends are real from the first deploy (owner decision 2026-11-22; docs/deploy.md section 6).
# It repeats the CMD on purpose: config as code overrides a start command left in the Railway dashboard (for example an old one with --dry-run). backend.test.ts keeps the two equal.
# Migrations run on boot under the advisory lock.
healthcheckPath = "/healthz"
# The first boot applies every migration before it listens.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# SIGTERM, then this long to finish the unit of work in flight (server.ts waits up to SHUTDOWN_GRACE_MS, 25 s by default).
drainingSeconds = 30
# The old and new deployments may overlap briefly; the per-network advisory locks keep ticks single.
overlapSeconds = 10
